# ---- Truecolor ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*:Tc"

# ---- Quality of life ----
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Flat Gruvbox status bar (no inverted blocks) ----
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left-length 30
set -g status-left "#[fg=#fabd2f,bold] #S #[default]"
set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#83a598]%H:%M "
setw -g window-status-current-format "#[fg=#fabd2f,bold] #I:#W "
setw -g window-status-format "#[fg=#928374] #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "fg=#ebdbb2,bg=#1d2021"
