# ---- Truecolor ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",*:Tc"
set-environment -g COLORTERM truecolor
set -ag update-environment "COLORTERM WT_SESSION WT_PROFILE_ID"
set -g focus-events on

# ---- Prefix: Ctrl+a (screen-style, adjacent to the Caps Lock->Ctrl remap) ----
unbind C-b
set -g prefix C-a
bind-key C-a last-window       # Double-tap Ctrl+a to toggle between last two windows
bind-key a   send-prefix       # Ctrl+a then a -> beginning of line (readline), or inner tmux
bind-key T   command-prompt -p "(rename-pane)" -I "#{pane_title}" "select-pane -T '%%'"
bind-key r   source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ---- Quality of life ----
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Flat Gruvbox status bar (no inverted blocks) ----
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left-length 30
set -g status-left "#[fg=#fabd2f,bold] #S #[default]"
set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#83a598]%H:%M "
setw -g window-status-current-format "#[fg=#fabd2f,bold] #I:#W "
setw -g window-status-format "#[fg=#928374] #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
set -g message-style "fg=#ebdbb2,bg=#1d2021"

# ---- One clipboard: tmux copies -> Windows clipboard via OSC 52 ----
# With `mouse on`, tmux captures mouse selection and copies into its OWN
# buffer stack, so nothing reaches Windows and Ctrl+V keeps pasting whatever
# a Windows app last put there. set-clipboard makes tmux emit OSC 52; the
# terminal-features line advertises that the outer terminal accepts it.
# Windows Terminal permits OSC 52 writes by default (compatibility.allowOSC52).
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# Copy-mode with vim semantics: v to select, y to yank, C-v for a block.
# set-clipboard (above) makes the yank emit OSC 52, so it lands in the
# Windows clipboard rather than only tmux's own buffer.
setw -g mode-keys vi
bind-key -T copy-mode-vi v     send -X begin-selection
bind-key -T copy-mode-vi C-v   send -X rectangle-toggle
bind-key -T copy-mode-vi y     send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel
